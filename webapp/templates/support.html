<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meownvelope - Support</title>
</head>
<body>
    <!-- Navigation (same as homepage) -->
    <header>
        <img src="/static/images/Cat_Cash_Logo.png" alt="Logo" width="50">
        <span>Meownvelope</span>
        <nav>
            <a href="/">Home</a>
            <a href="/info">Info</a>
            <a href="/about">About Us</a>
            <a href="/support">Support</a>
        </nav>
    </header>

    <!-- Page Title -->
    <h1>Contact Us 📮</h1>
    <p>Have questions about saving with Meownvelope? Our team is here to help you succeed!</p>

    <!-- Contact Form -->
    <h2>Send Us a Message 💌</h2>
    
    <form>
        <!-- Name Field -->
        <label>Your Name</label><br>
        <input type="text" placeholder="Enter your name" required><br><br>

        <!-- Email Field -->
        <label>Email Address</label><br>
        <input type="email" placeholder="your.email@example.com" required><br><br>

        <!-- Subject Field -->
        <label>Subject</label><br>
        <input type="text" placeholder="What's this about?" required><br><br>

        <!-- Message Field -->
        <label>Message</label><br>
        <textarea placeholder="Tell us what's on your mind..." required></textarea><br><br>

        <!-- Submit Button -->
        <button type="submit">Send Message 💌</button>
    </form>

</body>
</html>
