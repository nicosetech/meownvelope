<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meownvelope - Support</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation (same as homepage) -->
    <header class="navbar">
        <div class="nav-logo">
            <img src="/static/images/Cat_Cash_Logo.png" alt="Logo" width="50">
            <span>Meownvelope</span>
        </div>
        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/info">Info</a>
            <a href="/about">About Us</a>
            <a href="/support">Support</a>
        </nav>
    </header>

    <!-- Page Title -->
    <secction class="support-hero">
        <h1 class="support-title">Contact Us 📮</h1>
        <p class="support-subtitle">Have questions about saving with Meownvelope? Our team is here to help you succeed!</p>
    </secction>
    <!-- Contact Form -->
    <section class="form-wrapper">
        <h2 class="form-heading">Send Us a Message 💌</h2>
        <form class="contact-form" action="/support" method="POST">
            <label class="form-label">Your Name</label>
            <input class="form-input" type="text" name="name" placeholder="Enter your name" required>

            <label class="form-label">Email Address</label>
            <input class="form-input" type="email" name="email" placeholder="your.email@example.com" required>

            <label class="form-label">Subject</label>
            <input class="form-input" type="text" name="text" placeholder="What's this about?" required>

            <label class="form-label">Message</label>
            <textarea class="form-textarea" name="message" placeholder="Tell us what's on your mind..." required></textarea>

            <button class="form-button" type="submit">Send Message 🚀</button>
        </form>
    </section>

</body>
</html>
